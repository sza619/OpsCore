<!doctype html>
<html lang="en">
  <head>
    <!-- Basic HTML -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Custom Title -->
    <title>OpsCore – Real-Time RBAC SaaS Dashboard</title>

    <!-- Open Graph (Link Preview) -->
    <meta
      property="og:title"
      content="OpsCore – Real-Time RBAC Security Dashboard"
    />
    <meta
      property="og:description"
      content="Production-ready RBAC SaaS dashboard with real-time analytics, live audit logs, system alerts, and role-permission control."
    />
    <meta
      property="og:image"
      content="https://ops-core-beta.vercel.app/preview.png"
    />
    <meta property="og:url" content="https://ops-core-beta.vercel.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="OpsCore – Real-Time RBAC Security Dashboard"
    />
    <meta
      name="twitter:description"
      content="Production-ready RBAC SaaS dashboard with real-time analytics and audit logs."
    />
    <meta
      name="twitter:image"
      content="https://ops-core-beta.vercel.app/preview.png"
    />

    <script>
      const theme = localStorage.getItem("theme");
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
